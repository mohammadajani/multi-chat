<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Multichat Overlay</title>
<style>
  html, body {
    margin: 0; padding: 0; background: transparent; overflow: hidden;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
  }
  #stack {
    position: fixed; left: 14px; bottom: 14px; right: 14px;
    display: flex; flex-direction: column; gap: 8px; align-items: flex-start;
  }
  .msg {
    background: rgba(15, 17, 21, 0.82);
    color: #fff; font-size: 16px; line-height: 1.35;
    padding: 8px 14px; border-radius: 12px;
    max-width: 100%; word-wrap: break-word; word-break: break-word;
    box-shadow: 0 2px 8px rgba(0,0,0,0.35);
    animation: slideIn 0.22s ease-out;
    text-shadow: 0 1px 2px rgba(0,0,0,0.4);
  }
  .msg.leaving { animation: fadeOut 0.4s ease-in forwards; }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeOut {
    to { opacity: 0; transform: translateY(-10px); }
  }
  .badge {
    display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px;
    border-radius: 5px; margin-right: 7px; color: #0f1115; vertical-align: 1px;
  }
  .badge.twitch { background: #a970ff; }
  .badge.youtube { background: #ff5f5f; }
  .badge.kick { background: #53e08e; }
  .user { font-weight: 700; margin-right: 5px; }
</style>
</head>
<body>
<div id="stack"></div>
<script>
const PLATFORM_LABEL = { twitch: "Twitch", youtube: "YouTube", kick: "Kick" };
const params = new URLSearchParams(location.search);

const soundOn = params.get("sound") !== "0";
const volume = Math.min(1, Math.max(0, parseFloat(params.get("volume") ?? "0.4") || 0));
const maxVisible = Math.max(1, parseInt(params.get("max") ?? "6", 10) || 6);
const durationSec = Math.max(0, parseFloat(params.get("duration") ?? "12") || 0); // 0 = never auto-remove
const platformFilter = params.get("platform") || "all";
const channelFilter = params.get("channel") || "";

function matchesFilter(m) {
  if (platformFilter !== "all" && m.platform !== platformFilter) return false;
  if (channelFilter && m.channel !== channelFilter) return false;
  return true;
}

function escapeHtml(s) {
  return s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

// --- synthesized notification sound (no audio file needed) ---
let audioCtx = null;
let lastSoundAt = 0;
const SOUND_COOLDOWN_MS = 500; // don't let a burst of messages turn into a machine-gun of beeps

function playNotification() {
  if (!soundOn) return;
  const now = performance.now();
  if (now - lastSoundAt < SOUND_COOLDOWN_MS) return;
  lastSoundAt = now;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(880, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(640, audioCtx.currentTime + 0.14);
    gain.gain.setValueAtTime(0, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(volume, audioCtx.currentTime + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.22);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.25);
  } catch (e) { /* audio not available -- fail silently, overlay still works */ }
}

// --- rendering ---
const stack = document.getElementById("stack");

function addMessage(m) {
  const el = document.createElement("div");
  el.className = "msg";
  el.innerHTML =
    `<span class="badge ${m.platform}">${PLATFORM_LABEL[m.platform] || m.platform}</span>` +
    `<span class="user">${escapeHtml(m.username)}:</span>` +
    `<span class="text">${escapeHtml(m.text)}</span>`;
  stack.appendChild(el);
  playNotification();

  while (stack.children.length > maxVisible) {
    stack.removeChild(stack.firstChild);
  }

  if (durationSec > 0) {
    setTimeout(() => {
      el.classList.add("leaving");
      setTimeout(() => el.remove(), 450);
    }, durationSec * 1000);
  }
}

function connect() {
  const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws.onmessage = (event) => {
    const m = JSON.parse(event.data);
    if (matchesFilter(m)) addMessage(m);
  };
  ws.onclose = () => setTimeout(connect, 2000);
  ws.onerror = () => ws.close();
}
connect();
</script>
</body>
</html>
